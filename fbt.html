<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тренировка Beschwerde</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    #phrase,
    #inputField {
      font-size: 24px;
      margin-top: 20px;
    }

    #inputField {
      display: none;
      width: 80%;
      padding: 10px;
    }

    .error {
      background-color: #ffcccc;
    }

    .success {
      background-color: #ccffcc;
    }

    #errorCounter,
    #hintField {
      margin-top: 10px;
      font-size: 18px;
      color: red;
    }
  </style>
</head>

<body>

<h1>Тренировка Beschwerde</h1>

<select id="phraseList">
  <option value="">-- Выберите фразу --</option>
</select>

<br><br>

<button onclick="startExercise()">Начать</button>

<div id="phrase"></div>

<input
  type="text"
  id="inputField"
  oninput="checkInput()"
  autocomplete="off"
>

<div id="errorCounter">Ошибки: 0</div>

<div id="hintField"></div>


<audio id="beep">
  <source
    src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
    type="audio/ogg"
  >
</audio>

<audio id="success">
  <source
    src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
    type="audio/ogg"
  >
</audio>


<script>

let originalText = "";
let exerciseStarted = false;
let errorCount = 0;

const phraseMap = new Map();


/* =========================
   Загрузка файла с фразами
   ========================= */

function loadPhrases() {

  // Получаем имя текущего HTML-файла
  let htmlFileName = window.location.pathname.split('/').pop();

  // Если страница открыта как:
  // https://site.github.io/project/
  // считаем, что это index.html
  if (!htmlFileName) {
    htmlFileName = "index.html";
  }

  // Декодируем имя, если в URL есть специальные символы
  htmlFileName = decodeURIComponent(htmlFileName);

  // Убираем расширение .html
  const baseName = htmlFileName.replace(/\.[^.]+$/, "");

  // Формируем имя TXT-файла
  const txtFileName = baseName + ".txt";

  console.log("HTML-файл:", htmlFileName);
  console.log("Загружается:", txtFileName);


  fetch(txtFileName)

    .then(response => {

      if (!response.ok) {
        throw new Error(
          `Не удалось загрузить файл ${txtFileName}. HTTP ${response.status}`
        );
      }

      return response.text();
    })

    .then(data => {

      const lines = data
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      const phraseList =
        document.getElementById("phraseList");


      lines.forEach(line => {

        const [german, russian] =
          line.split(";").map(part => part.trim());


        if (german && russian) {

          phraseMap.set(russian, german);

          const option =
            document.createElement("option");

          option.value = russian;
          option.textContent = russian;

          phraseList.appendChild(option);
        }

      });

    })

    .catch(error => {

      console.error(
        "Ошибка загрузки фраз:",
        error
      );

      document.getElementById("phrase").innerText =
        "Ошибка: не удалось загрузить файл " +
        txtFileName;
    });
}


/* =========================
   Начало упражнения
   ========================= */

function startExercise() {

  const selectedRussian =
    document.getElementById("phraseList").value;


  if (!selectedRussian) {

    alert("Пожалуйста, выберите фразу.");

    return;
  }


  originalText =
    phraseMap.get(selectedRussian);


  document.getElementById("phrase").innerText =
    originalText;


  const inputField =
    document.getElementById("inputField");


  inputField.value = "";

  inputField.classList.remove(
    "error",
    "success"
  );

  inputField.style.display = "none";


  document.getElementById(
    "errorCounter"
  ).innerText = "Ошибки: 0";


  document.getElementById(
    "hintField"
  ).innerText = "";


  errorCount = 0;

  exerciseStarted = false;


  setTimeout(() => {

    document.getElementById(
      "phrase"
    ).innerText = "";


    inputField.style.display =
      "inline-block";


    inputField.focus();

  }, 3000);
}


/* =========================
   Проверка ввода
   ========================= */

function checkInput() {

  const inputField =
    document.getElementById("inputField");


  if (!exerciseStarted) {

    document.getElementById(
      "phrase"
    ).innerText = "";

    exerciseStarted = true;
  }


  const input =
    inputField.value;


  const expected =
    originalText.substring(
      0,
      input.length
    );


  if (input !== expected) {

    inputField.classList.add("error");

    inputField.classList.remove("success");


    document.getElementById(
      "beep"
    ).play();


    errorCount++;


    document.getElementById(
      "errorCounter"
    ).innerText =
      `Ошибки: ${errorCount}`;


    const hintChar =
      originalText.charAt(
        input.length - 1
      );


    document.getElementById(
      "hintField"
    ).innerText =
      `Подсказка: следующая буква "${hintChar}"`;

  }

  else {

    inputField.classList.remove("error");


    document.getElementById(
      "hintField"
    ).innerText = "";


    if (input === originalText) {

      inputField.classList.add(
        "success"
      );


      document.getElementById(
        "success"
      ).play();
    }
  }
}


/* =========================
   Запуск после загрузки
   ========================= */

window.onload = loadPhrases;

</script>

</body>
</html>
